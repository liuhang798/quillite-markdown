name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and update (for example: v2.2.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  WAILS_VERSION: "v2.13.0"
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  verify:
    name: Safety checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./...
      - run: go vet ./...
      - name: Release safety regression gate
        run: node scripts/test-release-safety.mjs
  windows:
    needs: verify
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve and validate version
        shell: pwsh
        run: |
          $version = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match application version v$version"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_VERSION}

          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:LOCALAPPDATA\Programs\NSIS\makensis.exe",
            "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\NSIS.NSIS\makensis.exe"
          )
          $existing = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          # 1) chocolatey (2 attempts) - its source is flaky, retry before giving up
          if (-not $existing) {
            foreach ($attempt in 1..2) {
              Write-Host "Attempt ${attempt}: choco install nsis..."
              choco install nsis --yes --no-progress *> $null
              $existing = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
              if ($existing) { break }
              Start-Sleep -Seconds 8
            }
          }

          # No unverified download fallback: fail closed if the package manager fails.

          if (-not $existing -or -not (Test-Path -LiteralPath $existing)) {
            throw 'makensis.exe was not found after installing NSIS'
          }
          $nsisBin = Split-Path -Parent $existing
          $env:PATH = "$nsisBin;$env:PATH"
          "PATH=$env:PATH" >> $env:GITHUB_ENV
          Write-Host "NSIS ready: $existing"
      - name: Build Windows installer
        shell: pwsh
        run: wails build -clean -platform windows/amd64 -o QuilliteMarkdown.exe -nsis -installscope user -webview2 embed -trimpath -nocolour
      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          $binary = "build/bin/QuilliteMarkdown.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            Get-ChildItem build/bin -Recurse | Format-Table FullName, Length
            throw "Expected Windows application binary was not found: $binary"
          }

          $makensisCandidates = @(
            (Get-Command makensis.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe",
            "$env:LOCALAPPDATA\Programs\NSIS\makensis.exe",
            "$env:ChocolateyInstall\bin\makensis.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) }
          $makensis = $makensisCandidates | Select-Object -First 1
          if (-not $makensis) {
            throw "makensis.exe was not found after installing NSIS"
          }
          Write-Host "Using NSIS compiler: $makensis"

          Push-Location build/windows/installer
          try {
            & $makensis "-DWAILS_INSTALL_SCOPE=user" "-DREQUEST_EXECUTION_LEVEL=user" "-DARG_WAILS_AMD64_BINARY=..\..\bin\QuilliteMarkdown.exe" "project.nsi"
            if ($LASTEXITCODE -ne 0) {
              throw "NSIS exited with code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          $installer = "build/bin/quillite-markdown-$env:APP_VERSION-windows-amd64.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Get-ChildItem build/bin -Recurse | Format-Table FullName, Length
            throw "Expected NSIS installer was not found: $installer"
          }

          ./scripts/test-windows-install-lifecycle.ps1 -CoreInstaller $installer
          ./scripts/build-windows-launcher.ps1 -CoreInstaller $installer -Output $installer

          $releaseDir = New-Item -ItemType Directory -Force build/bin/release
          $target = Join-Path $releaseDir.FullName "quillite-markdown-$env:APP_VERSION-windows-amd64.exe"
          Copy-Item -LiteralPath $installer -Destination $target -Force
          $binaryTarget = Join-Path $releaseDir.FullName "quillite-markdown-$env:APP_VERSION-windows-amd64.bin"
          Copy-Item -LiteralPath $binary -Destination $binaryTarget -Force
          Get-Item -LiteralPath $target, $binaryTarget | Format-Table FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: quillite-markdown-windows-x64
          path: build/bin/release/*
          if-no-files-found: error

  macos:
    needs: verify
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve and validate version
        shell: bash
        run: |
          version="$(node -p "require('./wails.json').info.productVersion")"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match application version v${version}" >&2
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build universal macOS application
        run: bash scripts/build-macos.sh darwin/universal
      - name: Create DMG
        shell: bash
        run: |
          app_path="build/bin/轻阅 Markdown.app"
          if [[ ! -d "${app_path}" ]]; then
            find build/bin -maxdepth 3 -print
            echo "The macOS .app bundle was not found in build/bin" >&2
            exit 1
          fi

          release_dir="build/bin/release"
          staging_dir="$(mktemp -d)"
          output_path="${release_dir}/quillite-markdown-${APP_VERSION}-macos-universal.dmg"
          mkdir -p "${release_dir}"
          cp -R "${app_path}" "${staging_dir}/轻阅 Markdown.app"
          ln -s /Applications "${staging_dir}/Applications"
          # Keep the mounted installer image out of Spotlight/Launchpad. Without
          # this marker macOS can show the DMG copy beside the installed app.
          touch "${staging_dir}/.metadata_never_index"

          created=false
          for attempt in 1 2 3; do
            echo "Creating DMG (attempt ${attempt}/3)..."
            rm -f "${output_path}"
            if hdiutil create -volname "轻阅 Markdown" -srcfolder "${staging_dir}" -ov -format UDZO "${output_path}"; then
              created=true
              break
            fi
            sleep 5
          done
          rm -rf "${staging_dir}"

          if [[ "${created}" != "true" || ! -f "${output_path}" ]]; then
            echo "Unable to create the macOS DMG after 3 attempts" >&2
            exit 1
          fi
          ls -lh "${output_path}"
      - name: Archive signed application for in-app updates
        shell: bash
        run: |
          app_path="build/bin/轻阅 Markdown.app"
          if [[ ! -d "${app_path}" ]]; then
            echo "Expected macOS application bundle was not found: ${app_path}" >&2
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "${app_path}"
          release_dir="build/bin/release"
          archive="${release_dir}/quillite-markdown-${APP_VERSION}-macos-universal.zip"
          rm -f "${archive}"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "${app_path}" "${archive}"
          ls -lh "${archive}"
      - uses: actions/upload-artifact@v4
        with:
          name: quillite-markdown-macos-universal
          path: build/bin/release/*
          if-no-files-found: error

  linux:
    needs: verify
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve and validate version
        shell: bash
        run: |
          version="$(node -p "require('./wails.json').info.productVersion")"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match application version v${version}" >&2
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}
      - name: Build Linux executable
        run: wails build -clean -platform linux/amd64 -o quillite-markdown -tags webkit2_41 -trimpath -nocolour
      - name: Build DEB and AppImage packages
        run: |
          mkdir -p package-root/DEBIAN package-root/usr/bin package-root/usr/share/applications package-root/usr/share/icons/hicolor/512x512/apps package-root/usr/share/mime/packages
          install -m 755 build/bin/quillite-markdown package-root/usr/bin/quillite-markdown
          install -m 644 packaging/linux/quillite-markdown.desktop package-root/usr/share/applications/quillite-markdown.desktop
          install -m 644 packaging/linux/quillite-markdown.xml package-root/usr/share/mime/packages/quillite-markdown.xml
          install -m 644 build/appicon.png package-root/usr/share/icons/hicolor/512x512/apps/quillite-markdown.png
          sed "s/@VERSION@/${APP_VERSION}/g" packaging/linux/control > package-root/DEBIAN/control
          install -m 755 packaging/linux/postinst package-root/DEBIAN/postinst
          install -m 755 packaging/linux/postrm package-root/DEBIAN/postrm
          dpkg-deb --build package-root "build/bin/quillite-markdown-${APP_VERSION}-linux-amd64.deb"

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          install -m 755 build/bin/quillite-markdown AppDir/usr/bin/quillite-markdown
          install -m 755 packaging/linux/AppRun AppDir/AppRun
          install -m 644 packaging/linux/quillite-markdown.desktop AppDir/quillite-markdown.desktop
          install -m 644 build/appicon.png AppDir/quillite-markdown.png
          curl -L --fail -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir "build/bin/quillite-markdown-${APP_VERSION}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: quillite-markdown-linux-x64
          path: |
            build/bin/quillite-markdown-*-linux-amd64.deb
            build/bin/quillite-markdown-*-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare release notes
        run: |
          version="${RELEASE_TAG#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            printf 'quillite-markdown %s\n\nSee the repository changelog for details.\n' "${version}" > release-notes.md
          fi
          awk '/^### 简体中文/ { capture = 1; next } /^### English/ { capture = 0 } capture { print }' release-notes.md > release-notes-zh.md
          awk '/^### English/ { capture = 1; next } capture { print }' release-notes.md > release-notes-en.md
          [[ -s release-notes-zh.md ]] || cp release-notes.md release-notes-zh.md
          [[ -s release-notes-en.md ]] || cp release-notes.md release-notes-en.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "quillite-markdown ${version}" --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber

            mapfile -t existing_assets < <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')
            for asset in "${existing_assets[@]}"; do
              case "${asset}" in
                md-reader-assistant-*|MD.*|MD阅读助手-*|MDReaderAssistant-Setup-*|轻阅\ Markdown-*|QuilliteMarkdown-Setup-*|*-macos-universal.bin)
                  gh release delete-asset "${RELEASE_TAG}" "${asset}" --yes
                  ;;
              esac
            done
          else
            gh release create "${RELEASE_TAG}" release-assets/* --notes-file release-notes.md --title "quillite-markdown ${version}"
          fi
      - name: Sync official website release catalog
        env:
          RELEASE_API_TOKEN: ${{ secrets.QUILLITE_RELEASE_API_TOKEN }}
          RELEASE_API_BASE_URL: ${{ vars.QUILLITE_RELEASE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_API_TOKEN}" ]]; then
            echo "QUILLITE_RELEASE_API_TOKEN is required because the official website is the only update and download channel." >&2
            exit 1
          fi
          base_url="${RELEASE_API_BASE_URL:-https://qm.ssssa.cn/api/v1/releases}"
          base_url="${base_url%/}"
          version="${RELEASE_TAG#v}"
          github_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          jq -n \
            --arg version "${version}" \
            --arg titleZh "轻阅 Markdown ${version}" \
            --arg titleEn "Quillite Markdown ${version}" \
            --rawfile notesZh release-notes-zh.md \
            --rawfile notesEn release-notes-en.md \
            --arg githubUrl "${github_url}" \
            '{version:$version,titleZh:$titleZh,titleEn:$titleEn,notesZh:$notesZh,notesEn:$notesEn,githubUrl:$githubUrl,published:false}' > official-release.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${RELEASE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @official-release.json \
            "${base_url}/publish"

          upload_asset() {
            local file="$1" platform="$2" kind="$3"
            [[ -f "${file}" ]] || { echo "Required release asset is missing: ${file}" >&2; exit 1; }
            echo "Uploading $(basename "${file}") to official website (${platform}/${kind})..."
            curl --fail-with-body --retry 3 --retry-all-errors \
              -X PUT \
              -H "Authorization: Bearer ${RELEASE_API_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              -H "X-File-Name: $(basename "${file}")" \
              --data-binary "@${file}" \
              "${base_url}/${version}/assets/${platform}/${kind}"
          }

          upload_asset "$(find release-assets -maxdepth 1 -name '*-windows-amd64.exe' -print -quit)" windows installer
          upload_asset "$(find release-assets -maxdepth 1 -name '*-windows-amd64.bin' -print -quit)" windows update
          upload_asset "$(find release-assets -maxdepth 1 -name '*-macos-universal.dmg' -print -quit)" macos installer
          upload_asset "$(find release-assets -maxdepth 1 -name '*-macos-universal.zip' -print -quit)" macos update
          upload_asset "$(find release-assets -maxdepth 1 -name '*-linux-amd64.deb' -print -quit)" linux deb
          upload_asset "$(find release-assets -maxdepth 1 -name '*-linux-x86_64.AppImage' -print -quit)" linux appimage
          jq '.published = true' official-release.json > official-release-published.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${RELEASE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @official-release-published.json \
            "${base_url}/publish"
